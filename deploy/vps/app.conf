# Read by deploy.sh and install.sh.
NAME=americaecon
BRANCH=main

# Vite builds the site into dist/. VITE_* values (the site's address, its anon
# key and the FRED key) are baked in at build time, so americaecon-deploy.service
# loads /etc/americaecon.env. americaecon.service runs the former Netlify
# functions (server/netlify-shim.mjs); nginx serves the built files.
build_release() {   # $1 = release directory to create (relative to the repo)
  rm -rf dist
  npm run build
  cp -r dist "$1"
}
