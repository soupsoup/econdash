# /etc/nginx/sites-available/americaecon-db-gateway
# Local only: the functions (wire.js) and checks from the VPS itself use this.
# The site uses https://americaecon.com.
server {
    listen 127.0.0.1:54390;
    server_name _;
    client_max_body_size 12m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffer_size 128k;
    proxy_buffers 8 128k;
    proxy_busy_buffers_size 256k;

    location /rest/v1/ { proxy_pass http://127.0.0.1:54392/; }
    location /storage/v1/ { proxy_pass http://127.0.0.1:54393; }
    location / { return 404; }
}
