# Admin pages and every write ask for the admin password (HTTP Basic,
# /etc/nginx/americaecon.htpasswd, made by database/setup.sh). On Netlify the
# create/edit pages and the database accepted writes from anyone.
map $request_method $americaecon_write_realm {
    default "America Econ admin";
    GET off;
    HEAD off;
    OPTIONS off;
}

server {
    listen 80;
    listen [::]:80;
    server_name americaecon.com www.americaecon.com;
    root /var/www/americaecon/.releases/current;
    index index.html;
    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    large_client_header_buffers 4 64k;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;

    location ^~ /rest/v1/ {
        auth_basic $americaecon_write_realm;
        auth_basic_user_file /etc/nginx/americaecon.htpasswd;
        proxy_buffer_size 128k;
        proxy_buffers 8 128k;
        proxy_busy_buffers_size 256k;
        proxy_pass http://127.0.0.1:54392/;
    }
    location ^~ /storage/v1/object/public/ {
        alias /var/lib/americaecon-storage/;
        expires 30d;
        add_header Cache-Control "public";
    }
    location ^~ /storage/v1/ {
        auth_basic $americaecon_write_realm;
        auth_basic_user_file /etc/nginx/americaecon.htpasswd;
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:54393;
    }
    # The data proxies are public (bls-proxy is a POST); the wire feed and its
    # settings only take writes from the admin.
    location ~ ^/(api|\.netlify/functions)/(wire|wire-settings)/?$ {
        auth_basic $americaecon_write_realm;
        auth_basic_user_file /etc/nginx/americaecon.htpasswd;
        proxy_pass http://127.0.0.1:4425;
    }
    # Plain prefixes (not ^~), so the wire rule above wins for its two paths.
    location /api/ { proxy_read_timeout 30s; proxy_pass http://127.0.0.1:4425; }
    location /.netlify/functions/ { proxy_read_timeout 30s; proxy_pass http://127.0.0.1:4425; }

    # Admin pages: ask once up front, so the browser has the password before
    # the page writes.
    location ~ ^/(admin|create-post|edit-post)(/|$) {
        auth_basic "America Econ admin";
        auth_basic_user_file /etc/nginx/americaecon.htpasswd;
        try_files $uri /index.html;
    }
    location ^~ /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location ^~ /attached_assets/ { expires 1d; }
    location / { try_files $uri /index.html; }
}
